<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Store guideline: 96×96 artwork centred in 128×128 with 16 px transparent padding. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7474ec"/>
      <stop offset="1" stop-color="#4a4ac4"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#bg)"/>
  <!-- the command bar: a search field with a magnifier -->
  <rect x="28" y="36" width="72" height="28" rx="14" fill="#fff"/>
  <circle cx="44" cy="49" r="6.5" fill="none" stroke="#5b5bd6" stroke-width="4"/>
  <line x1="49" y1="54" x2="54" y2="59" stroke="#5b5bd6" stroke-width="4" stroke-linecap="round"/>
  <!-- results -->
  <rect x="34" y="74" width="60" height="7" rx="3.5" fill="#fff" fill-opacity=".8"/>
  <rect x="34" y="88" width="42" height="7" rx="3.5" fill="#fff" fill-opacity=".5"/>
</svg>
